<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="けいさんクラフト">
<meta name="theme-color" content="#5fa83e">
<meta name="format-detection" content="telephone=no">
<title>けいさん クラフト</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", "Segoe UI", monospace;
    background: #87ceeb;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; border: none; }

  /* === がめん === */
  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: block; }

  .container {
    position: relative;
    min-height: 100%;
    padding: 20px 16px 40px;
    text-align: center;
    z-index: 2;
  }

  /* === はいけい === */
  .bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
    pointer-events: none;
  }
  .bg-sky {
    background: linear-gradient(180deg, #6cbcf0 0%, #a4dcf7 70%, #c8edff 100%);
  }
  .bg-sky::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 100px;
    background:
      linear-gradient(180deg, transparent 0, transparent 14px, #6b421f 14px, #6b421f 100%);
  }
  .bg-sky::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 86px; height: 14px;
    background: repeating-linear-gradient(90deg,
      #5fa83e 0 8px, #6cb845 8px 16px, #4f8e30 16px 24px, #6cb845 24px 32px);
    z-index: 1;
  }

  .bg-grass {
    background:
      linear-gradient(180deg, #87ceeb 0%, #87ceeb 55%, #5fa83e 55%, #5fa83e 70%, #6b421f 70%, #6b421f 100%);
  }
  .bg-river {
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0f5 45%, #4a9fd6 55%, #2e7ab8 100%);
  }
  .bg-city {
    background: linear-gradient(180deg, #ffa45c 0%, #ff7c3a 55%, #555 60%, #444 100%);
  }
  .bg-sea {
    background: linear-gradient(180deg, #1a4d7a 0%, #0a2d4a 100%);
  }

  /* === タイトル === */
  .title {
    font-size: 44px;
    color: #ffeb3b;
    font-weight: 900;
    text-shadow:
      3px 0 0 #2a2a2a, -3px 0 0 #2a2a2a,
      0 3px 0 #2a2a2a, 0 -3px 0 #2a2a2a,
      3px 3px 0 #2a2a2a, -3px -3px 0 #2a2a2a,
      3px -3px 0 #2a2a2a, -3px 3px 0 #2a2a2a,
      5px 5px 0 #555;
    margin: 20px 0 8px;
    letter-spacing: 2px;
  }
  .subtitle {
    color: #fff;
    text-shadow: 2px 2px 0 #333;
    font-size: 16px;
    margin-bottom: 20px;
  }

  /* === セーブスロット === */
  .slots {
    display: flex;
    gap: 10px;
    margin: 0 auto 18px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 600px;
  }
  .slot {
    position: relative;
    background: rgba(0,0,0,0.55);
    border: 3px solid #2a2a2a;
    box-shadow: 3px 3px 0 #2a2a2a;
    padding: 8px 14px;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    min-width: 130px;
    cursor: pointer;
  }
  .slot.active {
    background: rgba(255,235,59,0.25);
    border-color: #ffeb3b;
    box-shadow: 3px 3px 0 #ffeb3b;
  }
  .slot-name { font-size: 13px; color: #ffeb3b; }
  .slot-icons { font-size: 20px; min-height: 26px; letter-spacing: 2px; }
  .slot-empty { font-size: 13px; color: #ccc; min-height: 26px; padding-top: 5px; }
  .slot .del {
    position: absolute;
    top: -10px; right: -10px;
    width: 28px; height: 28px;
    background: #d44;
    border: 2px solid #2a2a2a;
    color: #fff;
    font-size: 16px;
    line-height: 22px;
    box-shadow: 2px 2px 0 #2a2a2a;
    display: none;
    font-weight: bold;
  }
  .slot.has-data .del { display: block; }
  .slot .del:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #2a2a2a; }

  /* === ステージカード === */
  .stages {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 600px;
    margin: 0 auto 18px;
  }
  @media (max-width: 520px) {
    .stages { grid-template-columns: repeat(2, 1fr); }
  }
  .stage {
    height: 160px;
    border: 4px solid #2a2a2a;
    box-shadow: 4px 4px 0 #2a2a2a;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .stage:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #2a2a2a; }
  .stage .name {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.65);
    padding: 6px 4px;
    font-size: 16px;
    text-shadow: 2px 2px 0 #000;
  }
  .stage .name .sub {
    display: block;
    font-size: 12px;
    color: #ffeb3b;
  }
  .stage .got {
    position: absolute; top: 4px; right: 6px;
    font-size: 26px;
    filter: drop-shadow(2px 2px 0 #000);
  }
  .stage.s-grass {
    background:
      linear-gradient(180deg, #87ceeb 0%, #87ceeb 55%, #5fa83e 55%, #6cb845 70%, #6b421f 70%, #6b421f 100%);
  }
  .stage.s-river {
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0f5 45%, #4a9fd6 55%, #2e7ab8 100%);
  }
  .stage.s-city {
    background: linear-gradient(180deg, #ffa45c 0%, #ff7c3a 55%, #555 60%, #444 100%);
  }
  .stage.s-sea {
    background: linear-gradient(180deg, #1a4d7a 0%, #0a2d4a 100%);
    animation: secretGlow 1.5s ease-in-out infinite;
  }
  @keyframes secretGlow {
    0%,100% { box-shadow: 4px 4px 0 #2a2a2a, inset 0 0 15px #ffeb3b; }
    50%     { box-shadow: 4px 4px 0 #2a2a2a, inset 0 0 30px gold, 0 0 20px #ffeb3b; }
  }

  /* === おたから バー === */
  .treasures {
    background: rgba(0,0,0,0.55);
    border: 3px solid #2a2a2a;
    padding: 10px 16px;
    display: inline-flex;
    gap: 14px;
    align-items: center;
    font-size: 14px;
  }
  .treasures .label { color: #ffeb3b; text-shadow: 2px 2px 0 #000; }
  .treasures .t {
    width: 36px; height: 36px;
    background: #333;
    border: 2px solid #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: #666;
  }
  .treasures .t.got { background: #222; box-shadow: inset 0 0 8px gold; color: #fff; }

  /* === プレイがめん === */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.6);
    border: 3px solid #2a2a2a;
    padding: 8px 14px;
    margin: 10px auto 14px;
    max-width: 500px;
    font-size: 16px;
  }
  .topbar b { color: #ffeb3b; }
  .stage-head {
    font-size: 24px;
    text-shadow: 2px 2px 0 #2a2a2a, -2px -2px 0 #2a2a2a, 2px -2px 0 #2a2a2a, -2px 2px 0 #2a2a2a;
    margin: 10px 0 6px;
  }
  .back-btn {
    position: fixed;
    top: 14px; left: 14px;
    background: #888;
    border: 3px solid #2a2a2a;
    box-shadow: 3px 3px 0 #2a2a2a;
    padding: 8px 14px;
    color: #fff;
    font-size: 14px;
    text-shadow: 2px 2px 0 #000;
    z-index: 100;
  }
  .back-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2a2a; }

  .qbox {
    background: rgba(255,255,255,0.95);
    color: #2a2a2a;
    border: 4px solid #2a2a2a;
    box-shadow: 4px 4px 0 #2a2a2a;
    padding: 18px 20px;
    margin: 0 auto 14px;
    max-width: 460px;
  }
  .picture { font-size: 28px; min-height: 36px; line-height: 1.2; margin-bottom: 6px; letter-spacing: 1px; }
  .picture .op { color: #d33; margin: 0 4px; }
  .picture .hint { font-size: 16px; color: #666; }
  .question { font-size: 38px; font-weight: bold; letter-spacing: 4px; }
  .question .blank {
    display: inline-block;
    min-width: 45px;
    color: #d33;
    border-bottom: 3px solid #d33;
  }
  .message {
    font-size: 18px;
    height: 28px;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 10px;
  }
  .message.ok { color: #6cff6c; }
  .message.ng { color: #ff6c6c; }

  .answers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 460px;
    margin: 0 auto;
  }
  .ans {
    font-size: 28px;
    color: #fff;
    padding: 14px 0;
    border: 4px solid #2a2a2a;
    background: linear-gradient(180deg, #9c6b3f 0%, #9c6b3f 50%, #7a5128 50%, #7a5128 100%);
    box-shadow: inset 3px 3px 0 rgba(255,255,255,0.2), inset -3px -3px 0 rgba(0,0,0,0.3), 3px 3px 0 #2a2a2a;
    text-shadow: 2px 2px 0 #000;
    font-weight: bold;
  }
  .ans:active { transform: translate(2px, 2px); box-shadow: inset 3px 3px 0 rgba(255,255,255,0.2), inset -3px -3px 0 rgba(0,0,0,0.3), 1px 1px 0 #2a2a2a; }
  .ans.correct { background: linear-gradient(180deg, #6cc73a 0%, #6cc73a 50%, #4a9c20 50%, #4a9c20 100%); animation: pop 0.4s; }
  .ans.wrong { background: linear-gradient(180deg, #d44 0%, #d44 50%, #922 50%, #922 100%); animation: shake 0.3s; }
  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* === けっか === */
  .result {
    max-width: 460px;
    margin: 60px auto 0;
    background: rgba(0,0,0,0.7);
    border: 4px solid #ffeb3b;
    box-shadow: 6px 6px 0 #2a2a2a, inset 0 0 20px rgba(255,235,59,0.2);
    padding: 24px 20px;
  }
  .r-title {
    font-size: 36px;
    color: #ffeb3b;
    text-shadow: 2px 2px 0 #2a2a2a, -2px -2px 0 #2a2a2a, 2px -2px 0 #2a2a2a, -2px 2px 0 #2a2a2a;
    margin-bottom: 14px;
  }
  .r-stars { font-size: 38px; min-height: 48px; margin-bottom: 10px; }
  .r-score { font-size: 18px; margin-bottom: 12px; }
  .r-treasure {
    margin: 14px 0;
    padding: 14px;
    background: rgba(255,235,59,0.15);
    border: 2px dashed #ffeb3b;
    display: none;
  }
  .r-treasure.show { display: block; animation: tin 0.7s; }
  .r-treasure .icon { font-size: 56px; display: block; filter: drop-shadow(3px 3px 0 #000); }
  .r-treasure .name { font-size: 18px; margin-top: 4px; }
  @keyframes tin { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .r-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .pbtn {
    font-size: 16px;
    padding: 10px 18px;
    border: 3px solid #2a2a2a;
    background: linear-gradient(180deg, #5b9bd5 0%, #5b9bd5 50%, #3a73a8 50%, #3a73a8 100%);
    color: #fff;
    box-shadow: 3px 3px 0 #2a2a2a;
    text-shadow: 2px 2px 0 #000;
  }
  .pbtn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2a2a; }
  .pbtn.gold { background: linear-gradient(180deg, #ffd700 0%, #ffd700 50%, #b8860b 50%, #b8860b 100%); color: #2a2a2a; text-shadow: 1px 1px 0 #fff; }

  /* === モーダル === */
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #c9b18a;
    border: 4px solid #2a2a2a;
    box-shadow: 6px 6px 0 #2a2a2a;
    padding: 20px;
    text-align: center;
    color: #2a2a2a;
    max-width: 360px;
    width: 100%;
  }
  .m-title { font-size: 22px; color: #c00; margin-bottom: 10px; text-shadow: 2px 2px 0 #fff; }
  .m-text { font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
  .m-text b { background: #2a2a2a; color: #ffeb3b; padding: 2px 6px; }
  .m-text .warn { color: #c00; font-weight: bold; }
  .m-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .mbtn {
    font-size: 16px;
    padding: 10px 18px;
    border: 3px solid #2a2a2a;
    color: #fff;
    box-shadow: 3px 3px 0 #2a2a2a;
    text-shadow: 2px 2px 0 #000;
  }
  .mbtn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2a2a; }
  .mbtn.safe { background: linear-gradient(180deg, #5fa83e 0%, #5fa83e 50%, #3a7028 50%, #3a7028 100%); }
  .mbtn.danger { background: linear-gradient(180deg, #d44 0%, #d44 50%, #922 50%, #922 100%); }

  /* === パーティクル === */
  .particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1500; overflow: hidden; }
  .p { position: absolute; font-size: 26px; animation: fall linear forwards; }
  @keyframes fall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0.5; }
  }
</style>
</head>
<body>

<!-- ====== JS うごかない とき の あんない ====== -->
<div id="jsWarn" style="position:fixed;top:0;left:0;right:0;background:#ffeb3b;color:#2a2a2a;padding:10px;text-align:center;z-index:9999;font-weight:bold;font-size:14px;line-height:1.5;border-bottom:3px solid #2a2a2a;">
  ⚠ ゲームを あそぶには <u>Safari で ひらいて</u> ください。<br>
  <span style="font-size:12px;font-weight:normal">（プレビューでは あそべません）</span>
</div>
<noscript>
  <div style="position:fixed;top:0;left:0;right:0;background:#d44;color:#fff;padding:20px;text-align:center;z-index:9999;font-weight:bold;">
    JavaScript が ゆうこうに なっていません。Safariで ひらいてください。
  </div>
</noscript>

<!-- ====== タイトル ====== -->
<div class="screen active" id="titleScreen">
  <div class="bg bg-sky"></div>
  <div class="container">
    <h1 class="title">けいさん クラフト</h1>
    <p class="subtitle">すてーじを えらんで ぼうけんに でかけよう！</p>
    <div class="slots" id="saveSlots"></div>
    <div class="stages" id="stageGrid"></div>
    <div><div class="treasures" id="treasureBar"></div></div>
  </div>
</div>

<!-- ====== プレイ ====== -->
<div class="screen" id="playScreen">
  <div class="bg" id="playBg"></div>
  <button class="back-btn" id="backBtn">◀ もどる</button>
  <div class="container">
    <h2 class="stage-head" id="stageHead"></h2>
    <div class="topbar">
      <div>もんだい <b id="count">1</b> / 10</div>
      <div>てんすう <b id="score">0</b></div>
    </div>
    <div class="qbox">
      <div class="picture" id="picture"></div>
      <div class="question" id="question"></div>
    </div>
    <div class="message" id="message">こたえを えらんでね！</div>
    <div class="answers" id="answers"></div>
  </div>
</div>

<!-- ====== けっか ====== -->
<div class="screen" id="resultScreen">
  <div class="bg" id="resultBg"></div>
  <div class="container">
    <div class="result">
      <div class="r-title" id="rTitle">クリア！</div>
      <div class="r-stars" id="rStars"></div>
      <div class="r-score" id="rScore"></div>
      <div class="r-treasure" id="rTreasure">
        <span class="icon" id="tIcon"></span>
        <div class="name" id="tName"></div>
      </div>
      <div class="r-buttons">
        <button class="pbtn" id="toTitleBtn">タイトルへ</button>
        <button class="pbtn gold" id="retryBtn">もういちど</button>
      </div>
    </div>
  </div>
</div>

<!-- ====== モーダル ====== -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="m-title" id="mTitle">ちゅうい！</div>
    <div class="m-text" id="mText"></div>
    <div class="m-buttons">
      <button class="mbtn safe" id="mCancel">やめる</button>
      <button class="mbtn danger" id="mOk">けす</button>
    </div>
  </div>
</div>

<div class="particles" id="particles"></div>

<script>
(function(){
  'use strict';

  // ====== ステージ ていぎ ======
  var STAGES = {
    grass: { id:'grass', name:'そうげん', sub:'たしざん', bg:'bg-grass', stageCls:'s-grass', mode:'plus',
             items:['🍎','🍏','🍒','🌻','🐰','🐝','🦋','⭐'],
             treasure:{ icon:'💚', name:'エメラルド' } },
    river: { id:'river', name:'かわら', sub:'ひきざん', bg:'bg-river', stageCls:'s-river', mode:'minus',
             items:['🐟','🐠','🐢','🦆','🌊','🐚','💦','🦦'],
             treasure:{ icon:'💎', name:'ダイヤモンド' } },
    city:  { id:'city',  name:'まち',   sub:'まぜまぜ', bg:'bg-city', stageCls:'s-city', mode:'mix',
             items:['🏠','🚗','🚕','🚌','🏪','🚦','🛵','🚲'],
             treasure:{ icon:'🟡', name:'きんかい' } },
    sea:   { id:'sea',   name:'うみのなか', sub:'むしくいざん', bg:'bg-sea', stageCls:'s-sea', mode:'mushikui',
             items:['🐙','🦑','🐡','🦈','🐳','🐬','🦀','🪸'],
             treasure:{ icon:'🌟', name:'ネザースター' }, secret:true }
  };
  var ORDER = ['grass','river','city','sea'];

  // ====== セーブ ======
  var SAVE_KEY = 'keisan_craft_v3';
  function safeGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
  function loadAll() {
    var raw = safeGet(SAVE_KEY);
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (d && d.slots && d.slots.length === 3) {
          if (typeof d.active !== 'number') d.active = 0;
          return d;
        }
      } catch(e) {}
    }
    return { active: 0, slots: [null, null, null] };
  }
  function saveAll() { safeSet(SAVE_KEY, JSON.stringify(allData)); }
  var allData = loadAll();

  function curSlot() {
    if (!allData.slots[allData.active]) allData.slots[allData.active] = {};
    return allData.slots[allData.active];
  }
  function slotEmpty(i) {
    var s = allData.slots[i];
    if (!s) return true;
    for (var k in s) if (s[k]) return false;
    return true;
  }

  // ====== ゲーム じょうたい ======
  var currentStage = null;
  var qCount = 0;
  var score = 0;
  var correctCount = 0;
  var current = null;
  var locked = false;

  // ====== DOM ======
  function $(id) { return document.getElementById(id); }
  function show(id) {
    var screens = document.getElementsByClassName('screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  // ====== タイトル えがく ======
  function renderTitle() {
    renderSaveSlots();
    renderStages();
    renderTreasureBar();
  }

  function renderSaveSlots() {
    var box = $('saveSlots');
    box.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var data = allData.slots[i];
      var isEmpty = slotEmpty(i);
      var isActive = (allData.active === i);

      var icons = '';
      if (!isEmpty) {
        for (var k = 0; k < ORDER.length; k++) {
          var sid = ORDER[k];
          if (data && data[sid]) icons += STAGES[sid].treasure.icon;
        }
        if (!icons) icons = '<span style="font-size:13px;color:#aaa">あたらしい ぼうけん</span>';
      }

      var div = document.createElement('div');
      div.className = 'slot' + (isActive ? ' active' : '') + (isEmpty ? '' : ' has-data');
      div.innerHTML =
        '<div class="slot-name">スロット ' + (i + 1) + '</div>' +
        (isEmpty
          ? '<div class="slot-empty">からっぽ</div>'
          : '<div class="slot-icons">' + icons + '</div>') +
        '<button class="del" type="button">×</button>';

      (function(idx, el) {
        el.addEventListener('click', function(e) {
          if (e.target.classList.contains('del')) return;
          switchSlot(idx);
        });
        el.querySelector('.del').addEventListener('click', function(e) {
          e.stopPropagation();
          askDelete(idx);
        });
      })(i, div);

      box.appendChild(div);
    }
  }

  function renderStages() {
    var grid = $('stageGrid');
    grid.innerHTML = '';
    var data = curSlot();

    var list = ['grass','river','city'];
    if (data.grass && data.river && data.city) list.push('sea');

    for (var i = 0; i < list.length; i++) {
      (function(id){
        var s = STAGES[id];
        var got = data[id];
        var card = document.createElement('div');
        card.className = 'stage ' + s.stageCls;
        card.innerHTML =
          (got ? '<div class="got">' + s.treasure.icon + '</div>' : '') +
          '<div class="name">' + s.name + '<span class="sub">' + s.sub + '</span></div>';
        card.addEventListener('click', function() { startStage(id); });
        grid.appendChild(card);
      })(list[i]);
    }
  }

  function renderTreasureBar() {
    var box = $('treasureBar');
    var data = curSlot();
    var html = '<span class="label">おたから:</span>';
    for (var i = 0; i < ORDER.length; i++) {
      var id = ORDER[i];
      var got = data[id];
      html += '<span class="t' + (got ? ' got' : '') + '">' + (got ? STAGES[id].treasure.icon : '?') + '</span>';
    }
    box.innerHTML = html;
  }

  // ====== セーブスロット ======
  function switchSlot(i) {
    if (allData.active === i) return;
    allData.active = i;
    saveAll();
    renderTitle();
  }

  function askDelete(i) {
    var s = allData.slots[i];
    var count = 0;
    if (s) for (var j = 0; j < ORDER.length; j++) if (s[ORDER[j]]) count++;
    showModal({
      title: 'ほんとうに けす？',
      text: '<b>スロット ' + (i + 1) + '</b> の セーブデータを<br>けしますか？<br>おたから ' + count + ' こ<br><span class="warn">けすと もどせません！</span>',
      onOk: function() {
        allData.slots[i] = null;
        saveAll();
        renderTitle();
      }
    });
  }

  function showModal(opt) {
    $('mTitle').textContent = opt.title || 'ちゅうい！';
    $('mText').innerHTML = opt.text || '';
    $('mOk').onclick = function() { hideModal(); if (opt.onOk) opt.onOk(); };
    $('mCancel').onclick = function() { hideModal(); if (opt.onCancel) opt.onCancel(); };
    $('modal').classList.add('show');
  }
  function hideModal() { $('modal').classList.remove('show'); }

  // ====== ステージ かいし ======
  function startStage(id) {
    currentStage = STAGES[id];
    qCount = 0;
    score = 0;
    correctCount = 0;
    locked = false;
    $('playBg').className = 'bg ' + currentStage.bg;
    $('stageHead').textContent = currentStage.name + ' （' + currentStage.sub + '）';
    show('playScreen');
    nextProblem();
  }

  // ====== もんだい ======
  function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  function makeProblem() {
    var mode = currentStage.mode;
    if (mode === 'plus') {
      var a = rand(1, 9), b = rand(1, 9);
      return { type: 'n', op: '＋', a: a, b: b, ans: a + b };
    }
    if (mode === 'minus') {
      var a2 = rand(2, 10), b2 = rand(1, a2 - 1);
      return { type: 'n', op: 'ー', a: a2, b: b2, ans: a2 - b2 };
    }
    if (mode === 'mix') {
      if (Math.random() < 0.5) {
        var ax = rand(1, 9), bx = rand(1, 9);
        return { type: 'n', op: '＋', a: ax, b: bx, ans: ax + bx };
      } else {
        var ay = rand(2, 10), by = rand(1, ay - 1);
        return { type: 'n', op: 'ー', a: ay, b: by, ans: ay - by };
      }
    }
    if (mode === 'mushikui') {
      var k = rand(0, 3);
      if (k === 0) { var ka = rand(1,9), kx = rand(1,9); return { type:'m', form:'a+?=c', a:ka, c:ka+kx, ans:kx }; }
      if (k === 1) { var kb = rand(1,9), ky = rand(1,9); return { type:'m', form:'?+b=c', b:kb, c:ky+kb, ans:ky }; }
      if (k === 2) { var kc = rand(3,10), kz = rand(1,kc-1); return { type:'m', form:'a-?=c', a:kc, c:kc-kz, ans:kz }; }
      var kd = rand(3,10), kw = rand(1,kd-1); return { type:'m', form:'?-b=c', b:kw, c:kd-kw, ans:kd };
    }
  }

  function drawProblem(p) {
    var pic = $('picture'), q = $('question');
    if (p.type === 'n') {
      var item = currentStage.items[rand(0, currentStage.items.length - 1)];
      var left = '', right = '';
      for (var i = 0; i < p.a; i++) left += item;
      for (var j = 0; j < p.b; j++) right += item;
      pic.innerHTML = left + '<span class="op">' + p.op + '</span>' + right;
      q.innerHTML = p.a + ' ' + p.op + ' ' + p.b + ' ＝ <span class="blank">？</span>';
    } else {
      pic.innerHTML = '<span class="hint">□ に はいる かずは？</span>';
      var html = '';
      if (p.form === 'a+?=c') html = p.a + ' ＋ <span class="blank">？</span> ＝ ' + p.c;
      if (p.form === '?+b=c') html = '<span class="blank">？</span> ＋ ' + p.b + ' ＝ ' + p.c;
      if (p.form === 'a-?=c') html = p.a + ' ー <span class="blank">？</span> ＝ ' + p.c;
      if (p.form === '?-b=c') html = '<span class="blank">？</span> ー ' + p.b + ' ＝ ' + p.c;
      q.innerHTML = html;
    }
  }

  function drawAnswers(correct) {
    var choices = {};
    choices[correct] = true;
    var keys = [correct];
    while (keys.length < 6) {
      var v = correct + rand(-4, 4);
      if (v >= 0 && v <= 18 && !choices[v]) { choices[v] = true; keys.push(v); }
    }
    keys.sort(function() { return Math.random() - 0.5; });
    var ans = $('answers');
    ans.innerHTML = '';
    for (var i = 0; i < keys.length; i++) {
      (function(v){
        var b = document.createElement('button');
        b.className = 'ans';
        b.type = 'button';
        b.textContent = v;
        b.addEventListener('click', function() { onAnswer(b, v); });
        ans.appendChild(b);
      })(keys[i]);
    }
  }

  function onAnswer(btn, v) {
    if (locked) return;
    locked = true;
    if (v === current.ans) {
      btn.classList.add('correct');
      score += 10;
      correctCount++;
      $('score').textContent = score;
      var msgs = ['せいかい！','すごい！','やったね！','ぴんぽーん！'];
      $('message').textContent = msgs[rand(0,3)];
      $('message').className = 'message ok';
      burst(8, ['✨','⭐','💚']);
      beep(880, 0.1);
      setTimeout(nextProblem, 800);
    } else {
      btn.classList.add('wrong');
      $('message').textContent = 'ざんねん… こたえは ' + current.ans;
      $('message').className = 'message ng';
      var buttons = $('answers').getElementsByTagName('button');
      for (var i = 0; i < buttons.length; i++) {
        if (parseInt(buttons[i].textContent) === current.ans) buttons[i].classList.add('correct');
      }
      beep(220, 0.2);
      setTimeout(nextProblem, 1500);
    }
  }

  function nextProblem() {
    qCount++;
    if (qCount > 10) { showResult(); return; }
    $('count').textContent = qCount;
    locked = false;
    current = makeProblem();
    drawProblem(current);
    drawAnswers(current.ans);
    $('message').textContent = 'こたえを えらんでね！';
    $('message').className = 'message';
  }

  // ====== けっか ======
  function showResult() {
    $('resultBg').className = 'bg ' + currentStage.bg;
    var stars = '';
    if (correctCount === 10) stars = '⭐⭐⭐';
    else if (correctCount >= 7) stars = '⭐⭐';
    else if (correctCount >= 4) stars = '⭐';
    else stars = '💪';
    $('rStars').textContent = stars;
    $('rScore').textContent = correctCount + ' / 10 もん せいかい！';

    var t = $('rTreasure');
    t.classList.remove('show');

    if (correctCount === 10) {
      $('rTitle').textContent = 'パーフェクト！';
      var data = curSlot();
      var wasNew = !data[currentStage.id];
      data[currentStage.id] = true;
      saveAll();
      t.classList.add('show');
      $('tIcon').textContent = currentStage.treasure.icon;
      if (currentStage.id === 'sea' && wasNew) {
        $('tName').innerHTML = 'でんせつの <b style="color:#ffeb3b">' + currentStage.treasure.name + '</b> を てに いれた！<br>ぼうけんは クリア！';
      } else if (wasNew) {
        $('tName').innerHTML = '<b style="color:#ffeb3b">' + currentStage.treasure.name + '</b> を てに いれた！';
      } else {
        $('tName').innerHTML = currentStage.treasure.name + ' をまた みつけた！';
      }
      burst(60, ['🎉','✨','⭐','💎','🌟','💚','🟡']);
    } else {
      $('rTitle').textContent = 'クリア！';
      if (correctCount >= 7) burst(20, ['✨','⭐']);
    }

    show('resultScreen');
  }

  // ====== パーティクル ======
  function burst(n, list) {
    var box = $('particles');
    for (var i = 0; i < n; i++) {
      var p = document.createElement('div');
      p.className = 'p';
      p.textContent = list[rand(0, list.length - 1)];
      p.style.left = rand(0, 100) + 'vw';
      p.style.top = '-30px';
      p.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      box.appendChild(p);
      (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 3500); })(p);
    }
  }

  // ====== おと ======
  var audioCtx = null;
  function beep(freq, dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = 0.08;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  // ====== ボタン ======
  $('backBtn').addEventListener('click', function() { renderTitle(); show('titleScreen'); });
  $('toTitleBtn').addEventListener('click', function() { renderTitle(); show('titleScreen'); });
  $('retryBtn').addEventListener('click', function() { if (currentStage) startStage(currentStage.id); });

  // ====== スタート ======
  // JS が うごいた しょうこに けいこくを かくす
  var warn = $('jsWarn');
  if (warn) warn.style.display = 'none';

  window.addEventListener('error', function(e) {
    console.error('[けいさんクラフト]', e.error || e.message);
  });
  try {
    renderTitle();
  } catch(err) {
    console.error('renderTitle:', err);
    try {
      allData = { active: 0, slots: [null, null, null] };
      renderTitle();
    } catch(err2) {
      console.error('saishokika fail:', err2);
    }
  }
})();
</script>
</body>
</html>
